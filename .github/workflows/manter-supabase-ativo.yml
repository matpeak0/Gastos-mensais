# Mantém o projeto do Supabase ativo (o plano gratuito pausa após 7 dias sem uso).
# Roda a cada 3 dias e também pode ser executado manualmente em Actions > Run workflow.

name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */3 * *"   # a cada 3 dias, por volta das 9h17 (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o banco
        env:
          SUPABASE_URL: "https://kznzvdlvivcixlbkxuql.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_ZFJ5jgZb_7vfPvIxQArB6w_bYkErxGK"
        run: |
          code=$(curl -sS -o resposta.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/gastos_docs?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta do Supabase: HTTP $code"
          if [ "$code" != "200" ]; then
            cat resposta.txt
            echo "::error::O Supabase não respondeu. O projeto pode estar pausado: reative em supabase.com."
            exit 1
          fi

      # O GitHub desliga tarefas agendadas em repositórios sem alterações por 60 dias.
      # Este passo registra uma alteração mínima a cada ~45 dias para evitar isso.
      - uses: actions/checkout@v4
      - name: Manter o repositório ativo
        run: |
          ultimo=$(git log -1 --format=%ct)
          agora=$(date +%s)
          dias=$(( (agora - ultimo) / 86400 ))
          echo "Dias desde a última alteração: $dias"
          if [ "$dias" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultimo-ping
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .ultimo-ping
            git commit -m "Manter repositório ativo"
            git push
          fi
